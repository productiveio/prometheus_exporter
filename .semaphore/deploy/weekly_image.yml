version: v1.0
name: Weekly prometheus_exporter rebuild
# Target of the Semaphore scheduled task "Weekly prometheus_exporter rebuild"
# (branch: productive). Mirrors productiveio/docker-images: promote latest ->
# stable, then rebuild latest on the fresh productiveio/ruby base. Schedule it a
# couple of hours AFTER the docker-images weekly job so it builds on the freshly
# rebuilt ruby (e.g. Sundays 04:00 -> cron `0 4 * * 0`).
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

global_job_config:
  prologue:
    commands:
      - checkout
      - source bin/generate_aws_credentials.sh
  env_vars:
    - name: AWS_ROLE
      value: semaphore-build-role
    - name: ECR_ACCOUNT
      value: 013323007402.dkr.ecr.eu-west-1.amazonaws.com
    # Set to "true" on the task to skip the weekly latest->stable promotion.
    - name: PROMOTION_HOLD
      value: "false"
    # Set to "true" to also commit channels.json back (needs push access).
    - name: COMMIT_CHANNELS
      value: "false"

blocks:
  # Runs first, before the rebuild overwrites latest: copies the current latest
  # (last week's build, soaked in staging) onto the stable channel.
  - name: 'Promote latest -> stable'
    dependencies: []
    task:
      jobs:
        - name: Promote image
          commands:
            - bin/promote_image.sh

  - name: 'Build & push latest'
    dependencies:
      - 'Promote latest -> stable'
    task:
      jobs:
        - name: buildx push
          commands:
            - aws ecr get-login-password --region eu-west-1 | docker login --username AWS --password-stdin "${ECR_ACCOUNT}"
            - docker run --privileged --rm tonistiigi/binfmt --install all
            - docker buildx create --use --name builder
            # Rebuild the fresh image (FROM productiveio/ruby:<ver>, the latest
            # ruby channel) and publish it as latest + an immutable dated snapshot.
            - >
              docker buildx build
              --platform linux/amd64,linux/arm64
              --provenance=false --pull --push
              -t "${ECR_ACCOUNT}/prometheus_exporter:latest"
              -t "${ECR_ACCOUNT}/prometheus_exporter:$(date -u +%Y%m%d)"
              .
            - bin/generate_channels_json.sh
