version: v1.0
name: prometheus_exporter (Productive fork)
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

# This config lives only on the `productive` branch (the default), which upstream
# `main` doesn't carry. The pipeline only runs on `productive`; the image build is
# promoted from there.
blocks:
  - name: Test
    run:
      # slim-image-test added temporarily so the multi-stage image build can be
      # validated from that branch; remove it before/at merge to keep productive-only.
      when: "branch = 'productive' OR branch = 'slim-image-test'"
    task:
      jobs:
        - name: rake test
          commands:
            - checkout
            - sem-version ruby 4.0.3
            - bundle config set path 'vendor/bundle'
            - bundle install
            - bundle exec rake test

promotions:
  - name: Build & push image
    pipeline_file: deploy/image.yml
    auto_promote:
      when: "result = 'passed' and (branch = 'productive' OR branch = 'slim-image-test')"
